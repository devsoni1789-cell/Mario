<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Super Adventure</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#65b9fa;touch-action:none;font-family:monospace}canvas{display:block;width:100%;height:100%}.btn{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;background:#0009;border:2px solid #fff5;box-shadow:0 3px 0 #0006;border-radius:18px;user-select:none}.l,.r{width:68px;height:68px;bottom:18px;font:bold 34px monospace}.l{left:18px}.r{left:96px}.j{right:20px;bottom:18px;width:82px;height:82px;border-radius:50%;font:bold 34px monospace}.p{right:18px;top:15px;width:55px;height:44px;border-radius:12px;font:bold 20px monospace}</style></head><body><canvas id="game"></canvas><div class="btn l" id="left">◀</div><div class="btn r" id="right">▶</div><div class="btn j" id="jump">▲</div><div class="btn p" id="pause">Ⅱ</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W=innerWidth,H=innerHeight,dpr=1;function resize(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
const input={left:false,right:false,jump:false};function touch(id,key){const e=document.getElementById(id);e.onpointerdown=a=>{a.preventDefault();input[key]=true;e.setPointerCapture(a.pointerId)};e.onpointerup=e.onpointercancel=()=>input[key]=false}touch('left','left');touch('right','right');touch('jump','jump');
let paused=false,gameOver=false,complete=false;document.getElementById('pause').onpointerdown=()=>paused=!paused;addEventListener('keydown',e=>{if(e.key==='ArrowLeft')input.left=true;if(e.key==='ArrowRight')input.right=true;if(e.key==='ArrowUp'||e.key===' ')input.jump=true;if(e.key==='Escape')paused=!paused});addEventListener('keyup',e=>{if(e.key==='ArrowLeft')input.left=false;if(e.key==='ArrowRight')input.right=false;if(e.key==='ArrowUp'||e.key===' ')input.jump=false});document.body.onpointerdown=e=>{if(e.target.classList.contains('btn'))return;if(gameOver||complete)restart();else if(paused)paused=false};
const levelW=10000,groundY=470;const player={x:100,y:350,w:34,h:52,vx:0,vy:0,onGround:false,big:false,inv:0};let camera=0,score=0,coins=0,lives=3,world=1,level=1,last=performance.now();
const platforms=[[0,470,900,70],[980,470,700,70],[1780,470,780,70],[2680,470,950,70],[3730,470,700,70],[4590,470,1000,70],[5710,470,760,70],[6630,470,1000,70],[7810,470,820,70],[8810,470,1190,70],[430,350,170,28],[700,290,150,28],[1120,350,190,28],[1450,290,170,28],[1900,350,170,28],[2160,300,180,28],[2820,350,170,28],[3100,285,190,28],[3890,350,180,28],[4160,300,170,28],[4720,345,190,28],[5040,275,190,28],[5870,350,180,28],[6140,290,190,28],[6770,345,190,28],[7060,280,180,28],[7950,350,190,28],[8260,290,180,28],[8960,350,190,28],[9280,285,200,28]].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));
const coinsList=[[470,315],[520,315],[740,255],[790,255],[1160,315],[1210,315],[1490,255],[1540,255],[1940,315],[2200,265],[2260,265],[2860,315],[3150,250],[3210,250],[3930,315],[4220,265],[4770,310],[4830,310],[5090,235],[5150,235],[5920,315],[6200,250],[6260,250],[6820,310],[7110,240],[7170,240],[8000,315],[8060,315],[8310,250],[9020,315],[9340,245],[9400,245]].map(([x,y])=>({x,y,got:false,bob:Math.random()*6}));
const enemies=[[620,420,520,850],[1240,420,1040,1650],[2020,420,1840,2500],[2940,420,2720,3550],[4000,420,3760,4400],[4820,420,4620,5480],[6020,420,5740,6420],[6920,420,6660,7520],[8080,420,7840,8580],[9200,420,8850,9700]].map(([x,y,min,max])=>({x,y,w:38,h:34,min,max,dir:1,alive:true}));
const powerups=[{x:755,y:245,type:'star',used:false},{x:3180,y:240,type:'boost',used:false},{x:6220,y:245,type:'star',used:false},{x:8330,y:245,type:'boost',used:false}];
const pipes=[[930,390,70,80],[1685,360,75,110],[2555,390,70,80],[3635,350,78,120],[4495,390,70,80],[5595,360,76,110],[6475,390,70,80],[7645,350,78,120],[8635,390,70,80]];
const blocks=[[550,260],[850,250],[1260,260],[1510,200],[1980,260],[2240,210],[3000,260],[4050,260],[4900,240],[6000,260],[6880,260],[8030,260],[9100,260]].map(([x,y])=>({x,y,w:38,h:38,hit:false}));
function pipeCollision(){for(const p of pipes)if(overlap(player,{x:p[0],y:p[1],w:p[2],h:p[3]})){if(player.vy>0&&player.y+player.h<p[1]+18){player.y=p[1]-player.h;player.vy=0;player.onGround=true}else if(player.x+player.w>p[0]&&player.x<p[0]+p[2]){if(player.x<p[0])player.x=p[0]-player.w;else player.x=p[0]+p[2];player.vx=0}}}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function resetPlayer(){player.x=100;player.y=350;player.vx=player.vy=0;player.big=false;player.inv=1.5;camera=0}function hurt(){if(player.inv>0)return;player.inv=1.8;if(player.big){player.big=false;return}lives--;if(lives<=0)gameOver=true;else resetPlayer()}function restart(){score=coins=0;lives=3;gameOver=complete=paused=false;coinsList.forEach(o=>o.got=false);enemies.forEach(e=>{e.alive=true;e.dir=1});blocks.forEach(b=>b.hit=false);powerups.forEach(p=>p.used=false);resetPlayer()}
function land(oldY){player.onGround=false;for(const r of platforms)if(player.x+player.w>r.x&&player.x<r.x+r.w&&oldY+player.h<=r.y&&player.y+player.h>=r.y&&player.vy>=0){player.y=r.y-player.h;player.vy=0;player.onGround=true}}
function update(dt){if(paused||gameOver||complete)return;if(player.inv>0)player.inv-=dt;const oldY=player.y,speed=player.big?270:240;if(input.left)player.vx=-speed;else if(input.right)player.vx=speed;else player.vx*=Math.pow(.02,dt);if(input.jump&&player.onGround){player.vy=-590;player.onGround=false;input.jump=false}player.vy+=1500*dt;player.x+=player.vx*dt;player.y+=player.vy*dt;player.x=Math.max(0,Math.min(levelW-player.w,player.x));land(oldY);
for(const b of blocks)if(!b.hit&&overlap(player,b)&&oldY>=b.y+b.h&&player.y<=b.y+b.h){b.hit=true;score+=25;if(Math.random()<.65)coins++}for(const o of coinsList)if(!o.got&&overlap(player,{x:o.x-10,y:o.y-15,w:20,h:30})){o.got=true;coins++;score+=100}for(const p of powerups)if(!p.used&&overlap(player,{x:p.x-15,y:p.y-20,w:30,h:35})){p.used=true;score+=250;if(p.type==='star')player.inv=7;else player.big=true}
for(const e of enemies)if(e.alive){e.x+=e.dir*75*dt;if(e.x<e.min||e.x>e.max)e.dir*=-1;if(overlap(player,e)){if(player.vy>100&&player.y+player.h<e.y+18){e.alive=false;player.vy=-400;score+=200}else hurt()}}if(player.y>700){lives--;if(lives<=0)gameOver=true;else resetPlayer()}if(player.x>9650)complete=true;camera=Math.max(0,Math.min(levelW-W,player.x-W*.35))}
function cloud(px,py,s){ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,20*s,0,7);ctx.arc(px+28*s,py-10*s,29*s,0,7);ctx.arc(px+62*s,py,22*s,0,7);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#65b9fa';ctx.fillRect(0,0,W,H);for(let i=-1;i<9;i++)cloud(i*220-camera*.08%220,80+(i%2)*25,.8);ctx.fillStyle='#55bd6b';for(let i=-1;i<10;i++){let px=i*230-camera*.15%230;ctx.beginPath();ctx.moveTo(px,470);ctx.lineTo(px+115,330);ctx.lineTo(px+230,470);ctx.fill()}ctx.save();ctx.translate(-camera,0);
for(const p of pipes){ctx.fillStyle='#2d9d54';ctx.fillRect(p[0],p[1],p[2],p[3]);ctx.fillStyle='#49c96c';ctx.fillRect(p[0]-6,p[1],p[2]+12,14)}for(const r of platforms){ctx.fillStyle=r.y>=470?'#9a6034':'#d58b38';ctx.fillRect(r.x,r.y,r.w,r.h);if(r.y>=470){ctx.fillStyle='#3c9b48';ctx.fillRect(r.x,r.y,r.w,9)}else{ctx.strokeStyle='#8b5224';ctx.strokeRect(r.x,r.y,r.w,28)}}for(const b of blocks){ctx.fillStyle=b.hit?'#98633b':'#d98b32';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeStyle='#70401e';ctx.strokeRect(b.x,b.y,b.w,b.h);if(!b.hit){ctx.fillStyle='#ffe0a0';ctx.font='bold 24px monospace';ctx.fillText('?',b.x+11,b.y+27)}}for(const o of coinsList)if(!o.got){ctx.fillStyle='#ffd51b';ctx.beginPath();ctx.ellipse(o.x,o.y+Math.sin(performance.now()/180+o.bob)*3,10,15,0,0,7);ctx.fill()}for(const p of powerups)if(!p.used){ctx.fillStyle=p.type==='star'?'#ffdf25':'#ee6333';ctx.beginPath();ctx.arc(p.x,p.y,15,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 14px monospace';ctx.fillText(p.type==='star'?'★':'B',p.x-8,p.y+5)}for(const e of enemies)if(e.alive){ctx.fillStyle='#7a4930';ctx.fillRect(e.x,e.y,e.w,e.h);ctx.fillStyle='#fff';ctx.fillRect(e.x+6,e.y+7,8,8);ctx.fillRect(e.x+24,e.y+7,8,8)}if(player.inv<=0||Math.floor(player.inv*12)%2===0){ctx.fillStyle='#ef7b2d';ctx.fillRect(player.x+4,player.y,player.w-8,16);ctx.fillStyle='#f7a13b';ctx.fillRect(player.x+7,player.y+4,player.w-14,5);ctx.fillStyle=player.big?'#e64b3c':'#1d6b8b';ctx.fillRect(player.x+2,player.y+15,player.w-4,25);ctx.fillStyle='#f2c49b';ctx.beginPath();ctx.arc(player.x+17,player.y+15,12,0,7);ctx.fill();ctx.fillStyle='#333';ctx.fillRect(player.x+2,player.y+40,13,12);ctx.fillRect(player.x+20,player.y+40,13,12)}ctx.fillStyle='#444';ctx.fillRect(9650,180,8,290);ctx.fillStyle='#f04d4d';ctx.beginPath();ctx.moveTo(9658,190);ctx.lineTo(9740,215);ctx.lineTo(9658,240);ctx.fill();ctx.restore();
ctx.fillStyle='#000b';ctx.fillRect(10,10,470,54);ctx.fillStyle='#fff';ctx.font='bold 18px monospace';ctx.fillText('ADVENTURE '+world+'-'+level+'   COINS '+coins+'   SCORE '+score+'   LIVES '+lives,22,44);if(paused||gameOver||complete){ctx.fillStyle='#000c';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 44px monospace';ctx.fillText(complete?'LEVEL COMPLETE!':gameOver?'GAME OVER':'PAUSED',W/2,H/2-25);ctx.font='18px monospace';ctx.fillText(complete||gameOver?'Tap the screen to play again':'Tap the screen to resume',W/2,H/2+25);ctx.textAlign='left'}}
function loop(t){const dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
