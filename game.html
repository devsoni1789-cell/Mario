<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Retro Bros</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#65b9fa;touch-action:none;font-family:monospace}canvas{display:block;width:100%;height:100%}.btn{position:absolute;width:72px;height:72px;border-radius:50%;background:#0008;color:#fff;display:flex;align-items:center;justify-content:center;font:bold 34px monospace;pointer-events:auto;user-select:none}.l{left:18px;bottom:22px}.r{left:102px;bottom:22px}.j{right:22px;bottom:18px;width:88px;height:88px}.p{right:18px;top:16px;width:54px;height:44px;border-radius:10px;font-size:22px}</style></head><body><canvas id="g"></canvas><div class="btn l" id="l">◀</div><div class="btn r" id="r">▶</div><div class="btn j" id="j">▲</div><div class="btn p" id="p">Ⅱ</div><script>
const c=document.getElementById('g'),x=c.getContext('2d');let W,H,S=1;function rs(){S=devicePixelRatio||1;W=innerWidth;H=innerHeight;c.width=W*S;c.height=H*S;x.setTransform(S,0,0,S,0,0)}onresize=rs;rs();const k={l:0,r:0,j:0};function b(id,n){let e=document.getElementById(id);e.onpointerdown=q=>{q.preventDefault();k[n]=1};e.onpointerup=e.onpointercancel=()=>k[n]=0}b('l','l');b('r','r');b('j','j');document.getElementById('p').onpointerdown=()=>paused=!paused;onkeydown=e=>{if(e.key=='ArrowLeft')k.l=1;if(e.key=='ArrowRight')k.r=1;if(e.key=='ArrowUp'||e.key==' ')k.j=1;if(e.key=='Escape')paused=!paused};onkeyup=e=>{if(e.key=='ArrowLeft')k.l=0;if(e.key=='ArrowRight')k.r=0;if(e.key=='ArrowUp'||e.key==' ')k.j=0};
const P={x:120,y:300,w:42,h:58,vx:0,vy:0},G=430,world=7600;let cam=0,score=0,lives=3,paused=0,over=0,won=0,last=performance.now();const q=[[0,G,1000,40],[1120,G,900,40],[2150,G,1150,40],[3450,G,850,40],[4450,G,1100,40],[5750,G,1850,40],[480,340,180,32],[760,280,150,32],[1300,340,170,32],[1550,280,160,32],[2350,330,180,32],[2700,270,190,32],[3200,330,150,32],[3650,285,180,32],[4700,325,180,32],[5100,255,200,32],[6000,335,180,32],[6400,285,170,32],[6800,335,180,32]].map(a=>({x:a[0],y:a[1],w:a[2],h:a[3]}));const cs=[[530,290],[580,290],[815,230],[865,230],[1335,290],[1390,290],[1580,230],[1635,230],[2380,280],[2430,280],[2740,220],[2800,220],[3250,280],[3690,235],[3750,235],[4740,275],[4800,275],[5150,205],[5210,205],[6050,285],[6110,285],[6460,235],[6520,235],[6850,285]].map(a=>({x:a[0],y:a[1],t:0}));const es=[[680,640,930],[1200,1140,1500],[1880,1700,1980],[2260,2200,3050],[2920,2800,3250],[3550,3480,4200],[4550,4500,5450],[5850,5800,6250],[6600,6500,7000]].map(a=>({x:a[0],y:396,min:a[1],max:a[2],d:1,a:1}));function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function reset(){P.x=120;P.y=300;P.vx=P.vy=0;cam=0}function lose(){if(--lives<=0)over=1;else reset()}function restart(){score=0;lives=3;over=won=paused=0;cs.forEach(a=>a.t=0);es.forEach(e=>{e.a=1;e.d=1});reset()}function ground(){let z=P.y+P.h;return q.some(r=>P.x+P.w>r.x&&P.x<r.x+r.w&&Math.abs(z-r.y)<5&&P.vy>=0)}function up(dt){if(paused||over||won)return;let oy=P.y;if(k.l)P.vx=-230;else if(k.r)P.vx=230;else P.vx*=Math.pow(.02,dt);if(k.j&&ground()){P.vy=-560;k.j=0}P.vy+=1350*dt;P.x+=P.vx*dt;P.y+=P.vy*dt;P.x=Math.max(0,Math.min(world-P.w,P.x));if(P.vy>=0)for(let r of q)if(P.x+P.w>r.x&&P.x<r.x+r.w&&oy+P.h<=r.y&&P.y+P.h>=r.y){P.y=r.y-P.h;P.vy=0;break}if(P.y>650){lose();return}for(let z of cs)if(!z.t&&hit(P,{x:z.x-10,y:z.y-15,w:20,h:30})){z.t=1;score++}for(let e of es)if(e.a){e.x+=e.d*72*dt;if(e.x<e.min||e.x>e.max)e.d*=-1;let r={x:e.x,y:e.y,w:40,h:34};if(hit(P,r)){if(P.vy>80&&P.y+P.h<e.y+18){e.a=0;P.vy=-340}else{lose();return}}}if(P.x>7040)won=1;cam=Math.max(0,Math.min(world-W,P.x-W*.32))}function draw(){x.clearRect(0,0,W,H);x.fillStyle='#65b9fa';x.fillRect(0,0,W,H);x.fillStyle='#fff';for(let i=0;i<8;i++){let a=i*230-cam*.08%230;x.beginPath();x.arc(a+35,80,22,0,7);x.arc(a+65,73,30,0,7);x.arc(a+100,82,20,0,7);x.fill()}x.fillStyle='#59c879';for(let i=-1;i<9;i++){let a=i*190-cam*.15%190;x.beginPath();x.moveTo(a,430);x.lineTo(a+95,320);x.lineTo(a+190,430);x.fill()}x.save();x.translate(-cam,0);for(let r of q){x.fillStyle=r.y>=430?'#88552e':'#dc963c';x.fillRect(r.x,r.y,r.w,r.h);if(r.y>=430){x.fillStyle='#399b41';x.fillRect(r.x,r.y,r.w,8)}}for(let z of cs)if(!z.t){x.fillStyle='#ffd719';x.beginPath();x.ellipse(z.x,z.y,10,15,0,0,7);x.fill()}for(let e of es)if(e.a){x.fillStyle='#7b4b30';x.fillRect(e.x,e.y,40,28);x.fillStyle='#fff';x.fillRect(e.x+7,e.y+7,8,8);x.fillRect(e.x+25,e.y+7,8,8)}x.fillStyle='#f08a28';x.fillRect(P.x+7,P.y,28,17);x.fillStyle='#195f7d';x.fillRect(P.x+5,P.y+15,32,28);x.fillStyle='#f5cd9b';x.beginPath();x.arc(P.x+21,P.y+15,12,0,7);x.fill();x.fillStyle='#333';x.fillRect(P.x+4,P.y+43,14,15);x.fillRect(P.x+25,P.y+43,14,15);x.fillStyle='#444';x.fillRect(7040,190,8,G-190);x.fillStyle='#f55';x.beginPath();x.moveTo(7048,200);x.lineTo(7125,220);x.lineTo(7048,240);x.fill();x.restore();x.fillStyle='#000a';x.fillRect(12,12,330,48);x.fillStyle='#fff';x.font='bold 18px monospace';x.fillText('COINS '+score+'   LIVES '+lives+'   WORLD 1-1',22,43);if(paused||over||won){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='bold 42px monospace';x.fillText(won?'LEVEL CLEAR!':over?'GAME OVER':'PAUSED',W/2,H/2-20);x.font='18px monospace';x.fillText('Tap screen to continue/restart',W/2,H/2+25);x.textAlign='left'}}document.body.onpointerdown=()=>{if(over||won)restart();else if(paused)paused=0};function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;up(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
