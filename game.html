<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Retro Bros Adventure</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#78c8ff;touch-action:none;font-family:system-ui,sans-serif}
canvas{display:block;width:100%;height:100%}.btn{position:fixed;z-index:3;display:flex;align-items:center;justify-content:center;color:white;background:#111a;border:2px solid #ffffff55;box-shadow:0 4px 0 #0008;border-radius:18px;font-weight:800;user-select:none;-webkit-user-select:none}
.left,.right{bottom:max(18px,env(safe-area-inset-bottom));width:72px;height:64px;font-size:30px}.left{left:18px}.right{left:98px}.jump{right:22px;bottom:max(18px,env(safe-area-inset-bottom));width:82px;height:82px;border-radius:50%;font-size:30px}.pause{right:18px;top:16px;width:54px;height:44px;border-radius:12px}
</style></head><body><canvas id="g"></canvas>
<div class="btn left" id="L">◀</div><div class="btn right" id="R">▶</div><div class="btn jump" id="J">▲</div><div class="btn pause" id="P">Ⅱ</div>
<script>
'use strict';
const cv=document.getElementById('g'),x=cv.getContext('2d',{alpha:false});let W=0,H=0,D=1;
function resize(){D=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);resize();
const key={l:false,r:false,j:false};let paused=false,ended=false,won=false,score=0,coins=0,lives=3,level=1,camera=0,spawn=80,jLock=false;
function bind(id,k){const e=document.getElementById(id);e.onpointerdown=a=>{a.preventDefault();key[k]=true;e.setPointerCapture(a.pointerId)};e.onpointerup=e.onpointercancel=()=>key[k]=false}
bind('L','l');bind('R','r');bind('J','j');document.getElementById('P').onpointerdown=()=>paused=!paused;
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')key.l=true;if(e.key==='ArrowRight')key.r=true;if(e.key==='ArrowUp'||e.key===' ')key.j=true;if(e.key==='Escape')paused=!paused});
addEventListener('keyup',e=>{if(e.key==='ArrowLeft')key.l=false;if(e.key==='ArrowRight')key.r=false;if(e.key==='ArrowUp'||e.key===' ')key.j=false});
const player={x:80,y:300,w:34,h:48,vx:0,vy:0,ground:false,big:false,inv:0};
let platforms=[],coinsA=[],foes=[],blocks=[],power=[],checkpoints=[],finish=0,worldW=0,cp=80;
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function makeLevel(n){
 platforms=[];coinsA=[];foes=[];blocks=[];power=[];checkpoints=[];
 const seg=n===1?[0,700,1450,2200,3000,3800,4700,5650,6600]:[0,650,1300,1950,2700,3450,4300,5200,6150];
 worldW=n===1?7200:6800;finish=worldW-260;
 for(let i=0;i<seg.length;i++){const a=seg[i],b=(seg[i+1]??worldW);platforms.push({x:a,y:470,w:b-a-55,h:70});}
 const tops=n===1?[[420,350,150],[820,300,150],[1180,355,180],[1540,285,170],[1870,350,180],[2280,300,180],[2640,350,160],[3120,290,180],[3480,350,170],[3950,300,180],[4380,350,190],[4840,285,170],[5320,345,180],[5800,290,170],[6250,345,190]]
 :[[360,350,160],[760,290,170],[1110,350,180],[1450,285,170],[1780,340,180],[2200,290,190],[2550,350,170],[2950,285,180],[3330,345,180],[3780,290,180],[4180,350,190],[4660,280,180],[5080,345,180],[5520,290,180],[5950,350,180]];
 tops.forEach(a=>platforms.push({x:a[0],y:a[1],w:a[2],h:24}));
 for(let i=0;i<tops.length;i++){let a=tops[i];coinsA.push({x:a[0]+45,y:a[1]-28,t:Math.random()*6});coinsA.push({x:a[0]+95,y:a[1]-28,t:Math.random()*6});}
 for(let i=0;i<seg.length-1;i++){const q=seg[i+1]-85;foes.push({x:q-90,y:430,w:36,h:34,min:q-190,max:q-15,v:1,alive:true});}
 [520,1280,2010,2780,3660,4520,5350,6170].forEach((q,i)=>blocks.push({x:q,y:i%2?235:275,w:40,h:40,used:false}));
 [930,1740,3200,4900,5900].forEach((q,i)=>power.push({x:q,y:i%2?220:260,used:false,big:i%2===0}));
 checkpoints=[{x:3400,hit:false},{x:5400,hit:false}];cp=80;spawn=80;resetPlayer();
}
function resetPlayer(){player.x=cp;player.y=360;player.vx=player.vy=0;player.ground=false;player.inv=2;camera=Math.max(0,player.x-W*.35)}
function hurt(){if(player.inv>0)return;player.inv=2;if(player.big){player.big=false;return}lives--;if(lives<=0){ended=true;return}resetPlayer()}
function restart(){score=coins=0;lives=3;level=1;ended=won=paused=false;makeLevel(1)}
function nextLevel(){level++;if(level>2){won=true;return}score+=1000;makeLevel(level)}
function solidLand(oldBottom){
 player.ground=false;
 for(const p of platforms)if(player.x+player.w>p.x&&player.x<p.x+p.w&&oldBottom<=p.y&&player.y+player.h>=p.y&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.ground=true;break}
}
function update(dt){
 if(paused||ended||won)return;
 if(player.inv>0)player.inv-=dt;
 const accel=1700,max=level===2?300:280;
 if(key.l)player.vx-=accel*dt;if(key.r)player.vx+=accel*dt;
 if(!key.l&&!key.r)player.vx*=Math.pow(.0008,dt);
 player.vx=Math.max(-max,Math.min(max,player.vx));
 if(key.j&&!jLock&&player.ground){player.vy=-600;jLock=true;player.ground=false}
 if(!key.j)jLock=false;
 player.vy+=1650*dt;
 const oldBottom=player.y+player.h;
 player.x+=player.vx*dt;player.y+=player.vy*dt;
 player.x=Math.max(0,Math.min(worldW-player.w,player.x));
 solidLand(oldBottom);
 for(const b of blocks)if(!b.used&&rect(player,b)&&player.vy<0&&player.y<b.y+b.h){b.used=true;score+=25;if(Math.random()<.7){coins++;}}
 for(const c of coinsA)if(!c.got&&rect(player,{x:c.x-12,y:c.y-16,w:24,h:32})){c.got=true;coins++;score+=100}
 for(const p of power)if(!p.used&&rect(player,{x:p.x-16,y:p.y-18,w:32,h:36})){p.used=true;score+=250;if(p.big)player.big=true;else player.inv=8}
 for(const e of foes)if(e.alive){e.x+=e.v*65*dt;if(e.x<e.min||e.x>e.max)e.v*=-1;if(rect(player,e)){if(player.vy>120&&player.y+player.h<e.y+16){e.alive=false;player.vy=-430;score+=200}else hurt()}}
 for(const c of checkpoints)if(!c.hit&&player.x>c.x){c.hit=true;cp=c.x+20;score+=300}
 if(player.y>720){lives--;if(lives<=0)ended=true;else resetPlayer()}
 if(player.x>finish)nextLevel();
 const target=Math.max(0,Math.min(worldW-W,player.x-W*.36));camera+=(target-camera)*Math.min(1,dt*8);
}
function cloud(px,py,s){x.fillStyle='#fff';x.beginPath();x.arc(px,py,20*s,0,7);x.arc(px+28*s,py-10*s,29*s,0,7);x.arc(px+62*s,py,22*s,0,7);x.fill()}
function draw(){
 x.fillStyle=level===2?'#24395c':'#79caff';x.fillRect(0,0,W,H);
 for(let i=-2;i<10;i++)cloud(i*230-camera*.08%230,75+(i&1)*24,.75);
 x.fillStyle=level===2?'#344c72':'#55b968';for(let i=-2;i<10;i++){let px=i*250-camera*.12%250;x.beginPath();x.moveTo(px,470);x.lineTo(px+125,330);x.lineTo(px+250,470);x.fill()}
 x.save();x.translate(-camera,0);
 for(const p of platforms){x.fillStyle=p.y===470?(level===2?'#555b62':'#8c5b35'):'#b87332';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle=level===2?'#6e7a85':'#42a64e';x.fillRect(p.x,p.y,p.w,8)}
 for(const b of blocks){x.fillStyle=b.used?'#8d623f':'#d58a32';x.fillRect(b.x,b.y,b.w,b.h);x.strokeStyle='#603c24';x.strokeRect(b.x,b.y,b.w,b.h);if(!b.used){x.fillStyle='#ffe4a6';x.font='bold 25px monospace';x.fillText('?',b.x+11,b.y+28)}}
 for(const c of coinsA)if(!c.got){x.fillStyle='#ffd43b';x.beginPath();x.ellipse(c.x,c.y+Math.sin(performance.now()/170+c.t)*3,10,15,0,0,7);x.fill()}
 for(const p of power)if(!p.used){x.fillStyle=p.big?'#ef6640':'#6de0ff';x.beginPath();x.arc(p.x,p.y,15,0,7);x.fill();x.fillStyle='#fff';x.font='bold 16px monospace';x.fillText(p.big?'G':'S',p.x-6,p.y+6)}
 for(const e of foes)if(e.alive){x.fillStyle='#6f4935';x.fillRect(e.x,e.y,e.w,e.h);x.fillStyle='#fff';x.fillRect(e.x+6,e.y+6,8,8);x.fillRect(e.x+23,e.y+6,8,8);x.fillStyle='#332';x.fillRect(e.x+5,e.y+27,26,5)}
 for(const c of checkpoints){x.fillStyle='#444';x.fillRect(c.x,370,7,100);if(c.hit){x.fillStyle='#5ee37a';x.fillRect(c.x+7,380,55,25)}else{x.fillStyle='#ffd34a';x.fillRect(c.x+7,380,55,25)}}
 x.fillStyle='#333';x.fillRect(finish,250,8,220);x.fillStyle='#ff5860';x.beginPath();x.moveTo(finish+8,260);x.lineTo(finish+95,285);x.lineTo(finish+8,310);x.fill();
 if(player.inv<=0||Math.floor(player.inv*12)%2===0){x.fillStyle='#f08a30';x.fillRect(player.x+3,player.y,player.w-6,15);x.fillStyle='#f2c59b';x.beginPath();x.arc(player.x+17,player.y+18,13,0,7);x.fill();x.fillStyle='#16708b';x.fillRect(player.x+3,player.y+28,28,18);if(player.big)x.fillRect(player.x,player.y+28,34,20);x.fillStyle='#252525';x.fillRect(player.x+2,player.y+44,13,4);x.fillRect(player.x+20,player.y+44,13,4)}
 x.restore();
 x.fillStyle='#000a';x.fillRect(12,12,470,52);x.fillStyle='#fff';x.font='700 17px system-ui';x.fillText('WORLD '+level+'   ◆ '+coins+'   SCORE '+score+'   ♥ '+lives,24,45);
 if(paused||ended||won){x.fillStyle='#000b';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle='#fff';x.font='800 42px system-ui';x.fillText(won?'ADVENTURE COMPLETE':ended?'GAME OVER':'PAUSED',W/2,H/2-20);x.font='18px system-ui';x.fillText(won?'Tap to play again':ended?'Tap to restart':'Tap the pause button to resume',W/2,H/2+25);x.textAlign='left'}
}
document.body.onpointerdown=e=>{if(e.target.classList.contains('btn'))return;if(ended||won)restart()};
let last=performance.now();function loop(t){let dt=Math.min(.032,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}makeLevel(1);requestAnimationFrame(loop);
</script></body></html>
